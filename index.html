<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@300;500;700&family=M+PLUS+Rounded+1c:wght@300;500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-gradient: linear-gradient(135deg, #fdfbfb 0%, #ebedee 100%);
            --glass-bg: rgba(255, 255, 255, 0.25);
            --glass-border: rgba(255, 255, 255, 0.5);
            --text-main: #444;
            --text-sub: #7b99b0;
            --accent: #8e9eab;
            --status-closed: #999;
            --status-consult: #b08d3e;
            --nav-height: 70px;
        }

        /* Base & Scroll Behavior */
        html, body {
            scroll-behavior: smooth;
            overflow-x: hidden;
            width: 100%;
        }

        body {
            font-family: 'Quicksand', 'M PLUS Rounded 1c', sans-serif;
            margin: 0;
            padding: 0;
            background: #e0e5ec;
            color: var(--text-main);
            min-height: 100vh;
            position: relative;
        }

        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Background Decoration */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(60px);
            z-index: -1;
            opacity: 0.8;
            animation: float 10s infinite alternate;
        }
        .blob-1 { top: -10%; left: -10%; width: 50vw; height: 50vw; background: #ffafbd; }
        .blob-2 { bottom: -10%; right: -10%; width: 60vw; height: 60vw; background: #2193b0; animation-delay: -5s; }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }

        /* Glass Navbar */
        .navbar {
            position: fixed;
            top: 0; left: 0; width: 100%;
            height: var(--nav-height);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--glass-border);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            box-sizing: border-box;
        }

        .nav-logo {
            font-weight: 700;
            font-size: 1.2rem;
            text-decoration: none;
            color: var(--text-main);
            letter-spacing: 0.1em;
            z-index: 1001;
            cursor: pointer;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            align-items: center;
            margin: 0;
            padding: 0;
            list-style: none;
        }

        .nav-item { position: relative; }
        .nav-link {
            text-decoration: none;
            color: var(--text-main);
            font-weight: 500;
            font-size: 0.95rem;
            transition: 0.3s;
            cursor: pointer;
        }
        .nav-link:hover { color: var(--accent); }

        /* Dropdown (Desktop) */
        .dropdown-menu {
            position: absolute;
            top: 100%; left: 50%;
            transform: translateX(-50%) translateY(10px);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            min-width: 180px;
            padding: 0.5rem 0;
            opacity: 0;
            visibility: hidden;
            transition: 0.3s;
            box-shadow: 0 8px 20px rgba(0,0,0,0.05);
        }
        .nav-item:hover .dropdown-menu {
            opacity: 1; visibility: visible;
            transform: translateX(-50%) translateY(0);
        }
        .dropdown-item {
            padding: 0.7rem 1.2rem;
            text-decoration: none;
            color: var(--text-main);
            display: block;
            font-size: 0.85rem;
            transition: 0.2s;
            cursor: pointer;
        }
        .dropdown-item:hover { background: rgba(0,0,0,0.05); color: var(--accent); }

        /* Mobile Menu */
        .mobile-toggle {
            display: none; flex-direction: column; justify-content: center; align-items: center;
            width: 40px; height: 40px; cursor: pointer; z-index: 1001; gap: 6px;
        }
        .mobile-toggle span {
            display: block; width: 25px; height: 2px;
            background: var(--text-main); transition: 0.3s; border-radius: 2px;
        }
        .mobile-toggle.active span:nth-child(1) { transform: translateY(8px) rotate(45deg); }
        .mobile-toggle.active span:nth-child(2) { opacity: 0; }
        .mobile-toggle.active span:nth-child(3) { transform: translateY(-8px) rotate(-45deg); }

        /* Container & Sections */
        .container {
            max-width: 1100px;
            margin: 0 auto;
            padding: calc(var(--nav-height) + 2rem) 2rem 4rem;
            box-sizing: border-box;
        }

        .section-title {
            text-align: center; font-size: 1.8rem; margin-bottom: 2.5rem;
            color: #333; letter-spacing: 0.1em;
            /* 初期状態：透明度0、30px下に配置 */
            opacity: 0;
            transform: translateY(30px);
            /* 修正：1.2s -> 1.8s に延長して、よりゆっくりとした動きに */
            transition: opacity 1.8s cubic-bezier(0.25, 1, 0.5, 1), transform 1.8s cubic-bezier(0.25, 1, 0.5, 1);
        }

        /* 表示時のクラス */
        .section-title.reveal {
            opacity: 1;
            transform: translateY(0);
        }

        /* Glass Card */
        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.05);
            padding: 2.5rem;
            margin-bottom: 3rem;
            opacity: 0;
            animation: fadeInUp 1s ease-out forwards;
            box-sizing: border-box;
        }

        /* Profile Card Specific */
        .profile-card {
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Buttons */
        .glass-btn {
            background: rgba(255, 255, 255, 0.4);
            padding: 0.7rem 1.4rem;
            border-radius: 50px;
            text-decoration: none;
            color: #555;
            font-weight: 700;
            transition: 0.3s;
            border: 1px solid #fff;
            font-size: 0.9rem;
            cursor: pointer;
            display: inline-block;
        }
        .glass-btn:hover {
            background: #fff;
            transform: translateY(-2px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* Links Row */
        .links-row {
            display: flex;
            justify-content: center;
            gap: 1rem;
            flex-wrap: wrap;
            margin-top: 2rem;
            width: 100%;
        }

        /* Service Section */
        .service-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        .service-item {
            text-align: center; padding: 2.5rem 2rem; transition: 0.3s;
            display: flex; flex-direction: column; align-items: center;
        }
        .service-icon-svg { 
            width: 60px; height: 60px; margin-bottom: 1.5rem; color: #5a7d9a;
            fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round;
        }
        .service-item h3 { margin: 0 0 0.8rem 0; color: #444; font-size: 1.25rem; }
        .service-item p { font-size: 0.95rem; color: #777; line-height: 1.6; margin-bottom: 1.5rem; flex-grow: 1; }

        /* Filtering UI */
        .filter-row {
            display: flex; justify-content: center; gap: 0.8rem; margin-bottom: 2rem; flex-wrap: wrap;
        }
        .filter-btn {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--glass-border);
            padding: 0.5rem 1.2rem;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: 0.3s;
            color: #666;
        }
        .filter-btn.active {
            background: #fff;
            color: var(--accent);
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }

        /* Gallery/Work Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            gap: 2rem;
        }
        .work-card {
            background: rgba(255, 255, 255, 0.4);
            border-radius: 20px; overflow: hidden;
            transition: 0.3s; cursor: pointer;
            border: 1px solid var(--glass-border);
            display: flex; flex-direction: column;
            opacity: 0; animation: fadeInUp 0.8s ease-out forwards;
        }
        .work-card:hover { transform: translateY(-8px); background: rgba(255, 255, 255, 0.6); box-shadow: 0 15px 35px rgba(0,0,0,0.05); }
        .work-img-wrapper { width: 100%; aspect-ratio: 1.6 / 1; overflow: hidden; background: #eee; }
        .work-img-wrapper img { width: 100%; height: 100%; object-fit: cover; transition: 0.5s; }
        .work-info { padding: 1.5rem; text-align: left; }
        .work-client { color: var(--text-sub); font-size: 0.8rem; font-weight: 500; margin-bottom: 0.3rem; }
        .work-title { font-size: 1.15rem; font-weight: 700; color: #333; margin-bottom: 1rem; line-height: 1.4; }
        .work-tags { display: flex; flex-wrap: wrap; gap: 0.5rem; }
        .work-tag { font-size: 0.75rem; color: #888; background: rgba(0,0,0,0.05); padding: 0.2rem 0.6rem; border-radius: 4px; }

        /* Modal Settings (Strictly for Works) */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(12px);
            z-index: 2000;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .modal-overlay.active { opacity: 1; visibility: visible; }
        .modal-content {
            width: 90%; max-width: 850px;
            background: #fff; border-radius: 24px; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            transform: scale(0.9); transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            max-height: 90vh; display: flex; flex-direction: column;
            position: relative;
        }
        .modal-overlay.active .modal-content { transform: scale(1); }
        .close-modal {
            position: absolute; top: 1.5rem; right: 1.5rem;
            width: 40px; height: 40px; background: rgba(0,0,0,0.05);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 10; font-size: 1.5rem;
        }

        /* View Switching Specifics */
        .view-content { display: block; width: 100%; }
        .hidden { display: none !important; }

        .table-container { width: 100%; overflow-x: auto; margin: 1.5rem 0; border-radius: 12px; border: 1px solid #eee; }
        .schedule-table { width: 100%; border-collapse: collapse; font-size: 0.9rem; min-width: 500px; text-align: left; }
        .schedule-table th { background: #f8f9fa; padding: 1.2rem 1rem; color: #555; border-bottom: 2px solid #eee; }
        .schedule-table td { padding: 1.2rem 1rem; border-bottom: 1px solid #eee; color: #444; }
        .status-closed { color: var(--status-closed); font-weight: 700; }
        .status-consult { color: var(--status-consult); font-weight: 700; }

        /* Responsive Settings */
        @media (max-width: 768px) {
            .navbar { padding: 0 1rem; }
            .mobile-toggle { display: flex; }
            .nav-links {
                position: fixed; top: 0; left: 0; width: 100%; height: 100vh;
                background: rgba(255, 255, 255, 0.98); backdrop-filter: blur(20px);
                flex-direction: column; justify-content: center;
                padding: 4rem 2rem; gap: 2.5rem;
                transform: translateX(100%); transition: 0.4s;
                z-index: 1000; box-sizing: border-box;
            }
            .nav-links.active { transform: translateX(0); }
            .nav-item { width: 100%; text-align: center; }
            .nav-link { font-size: 1.4rem; font-weight: 700; }
            .dropdown-menu {
                position: static; transform: none; width: 100%; opacity: 1; visibility: visible;
                background: transparent; border: none; box-shadow: none; display: block; margin-top: 0.5rem;
            }
            .dropdown-item { font-size: 1rem; padding: 0.5rem; color: var(--accent); }
            .container { padding: calc(var(--nav-height) + 1rem) 1.2rem 3rem; width: 100%; }
            .gallery-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>

                { client: "みなと環境にやさしい事業者会議", title: "フライヤーデザイン", cat: "print", tags: ["#フライヤー", "#自治体", "#グラフィック"], img: "image/image6.jpg" },
                { client: "みなと環境にやさしい事業者会議", title: "POPデザイン", cat: "print", tags: ["#POP", "#toC", "#自治体"], img: "image/image7.jpg" },
                { client: "株式会社5AM", title: "サービス説明資料制作", cat: "slide", tags: ["#スライド", "#toB", "#グラフィック"], img: "image/image8.jpg" },
                { client: "株式会社SciCareer", title: "講座用スライド制作", cat: "slide", tags: ["#スライド", "#toC", "#グラフィック"], img: "image/image9.jpg" },
                { client: "東京都港区", title: "報告書スライド制作", cat: "slide", tags: ["#スライド", "#自治体", "#グラフィック"], img: "image/image10.jpg" },
                { client: "株式会社epika", title: "営業資料制作", cat: "slide", tags: ["#スライド", "#toB", "#グラフィック"], img: "image/image11.jpg" },
                { client: "株式会社ミライテラス", title: "営業資料制作", cat: "slide", tags: ["#スライド", "#toB", "#グラフィック"], img: "image/image12.jpg" },           
                { client: "みなと環境にやさしい事業者会議", title: "看板デザイン", cat: "print", tags: ["#看板", "#自治体", "#グラフィック"], img: "image/image13.jpg" },
                { client: "みなと環境にやさしい事業者会議", title: "パンフレット制作", cat: "print", tags: ["#パンフレット", "#自治体", "#DTP"], img: "image/image14.jpg" }
            ]
        };

        const catMap = { card: "名刺制作", slide: "スライド制作", print: "印刷・広報物" };

        document.addEventListener('DOMContentLoaded', () => initApp());

        function initApp() {
            document.getElementById('user-name').textContent = config.name;
            document.getElementById('user-role').textContent = config.role;
            document.getElementById('user-bio').innerHTML = config.bio;
            if (config.freeContent.show) {
                document.getElementById('text-content-title').textContent = config.freeContent.title;
                document.getElementById('text-content-body').innerHTML = config.freeContent.body;
            }
            const lc = document.getElementById('links-container');
            lc.innerHTML = '';
            config.links.forEach(l => {
                const b = document.createElement('a');
                b.className = 'glass-btn';
                b.textContent = l.label;
                if (l.isSchedule) { b.onclick = (e) => { e.preventDefault(); showView('schedule'); }; }
                else { b.href = l.url; b.target = "_blank"; b.rel = "noopener noreferrer"; }
                lc.appendChild(b);
            });
            const fr = document.getElementById('filter-row');
            const uniqueCats = [...new Set(config.worksData.map(w => w.cat))];
            uniqueCats.forEach(c => {
                const b = document.createElement('button');
                b.className = 'filter-btn';
                b.textContent = catMap[c] || c;
                b.onclick = (e) => {
                    document.querySelectorAll('.filter-btn').forEach(x => x.classList.remove('active'));
                    e.target.classList.add('active');
                    filterWorks(c);
                };
                fr.appendChild(b);
            });
            
            const tb = document.getElementById('schedule-tbody');
            tb.innerHTML = '';
            config.schedule.forEach(item => {
                const tr = document.createElement('tr');
                const sc = item.type === 'closed' ? 'status-closed' : 'status-consult';
                tr.innerHTML = `<td>${item.period}</td><td class="${sc}">${item.status}</td><td>${item.note}</td>`;
                tb.appendChild(tr);
            });

            renderGallery('all');
            initScrollObserver();
        }

        function initScrollObserver() {
            const observerOptions = {
                root: null,
                rootMargin: '0px',
                threshold: 0.1
            };

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('reveal');
                    }
                });
            }, observerOptions);

            document.querySelectorAll('.section-title').forEach(title => {
                observer.observe(title);
            });
        }

        function renderGallery(filter = 'all') {
            const grid = document.getElementById('gallery-grid');
            grid.innerHTML = '';
            config.worksData.forEach((w, i) => {
                if (filter !== 'all' && w.cat !== filter) return;
                const card = document.createElement('div');
                card.className = 'work-card';
                card.style.animationDelay = `${0.05 * i}s`;
                card.innerHTML = `<div class="work-img-wrapper"><img src="${w.img}" alt="${w.title}" loading="lazy" onerror="this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22400%22%20height%3D%22250%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%3E%3Crect%20width%3D%22400%22%20height%3D%22250%22%20fill%3D%22%23eee%22%2F%3E%3Ctext%20x%3D%2250%25%22%20y%3D%2250%25%22%20dominant-baseline%3D%22middle%22%20text-anchor%3D%22middle%22%20fill%3D%22%23999%22%3EMissing%3C%2Ftext%3E%3C%2Fsvg%3E'"></div><div class="work-info"><p class="work-client">${w.client}</p><h3 class="work-title">${w.title}</h3><div class="work-tags">${w.tags.map(t => `<span class="work-tag">${t}</span>`).join('')}</div></div>`;
                card.onclick = () => openWorkModal(w);
                grid.appendChild(card);
            });
        }

        function filterWorks(cat) { renderGallery(cat); }

        function showView(viewId, isScrollToTop = true) {
            document.querySelectorAll('.view-content').forEach(v => v.classList.add('hidden'));
            const target = document.getElementById(`${viewId}-view`);
            if (target) target.classList.remove('hidden');
            if (isScrollToTop) window.scrollTo({ top: 0, behavior: 'smooth' });
            closeMobileMenu();
        }

        function scrollToSection(id) {
            showView('home', false);
            const el = document.getElementById(id);
            if (el) window.scrollTo({ top: el.offsetTop - 70, behavior: 'smooth' });
        }

        function toggleMobileMenu() {
            document.getElementById('nav-links').classList.toggle('active');
            document.getElementById('mobile-toggle').classList.toggle('active');
        }

        function closeMobileMenu() {
            document.getElementById('nav-links').classList.remove('active');
            document.getElementById('mobile-toggle').classList.remove('active');
        }

        const modal = document.getElementById('modal');
        function openWorkModal(work) {
            document.getElementById('modal-img').src = work.img;
            document.getElementById('modal-client').textContent = work.client;
            document.getElementById('modal-title').textContent = work.title;
            document.getElementById('modal-tags').innerHTML = work.tags.map(t => `<span class="work-tag" style="background:#f0f4f8; color:#5a7d9a; border:none; padding: 0.3rem 0.8rem; font-size: 0.85rem;">${t}</span>`).join('');
            modal.classList.add('active');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            modal.classList.remove('active');
            document.body.style.overflow = 'auto';
        }
    </script>
</body>
</html>
